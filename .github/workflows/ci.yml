name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Require tmux E2E tools
        run: command -v tmux script
      - name: Check formatting
        run: cargo +1.85.0 fmt --all -- --check
      - name: Lint
        run: cargo +1.85.0 clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +1.85.0 test --locked --all-features
      - name: Test deterministic release packaging
        run: tests/release_packaging.sh

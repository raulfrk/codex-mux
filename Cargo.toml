[package]
name = "codex-mux"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A tmux-native switcher for Codex sessions"
keywords = ["codex", "tmux", "tui"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5.32", features = ["derive"] }
crossterm = "0.28.1"
ratatui = "0.29.0"
rustix = { version = "0.38.44", features = ["fs"] }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
toml = "0.8.20"
